
name: Build RABI3 iOS Simulator App

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/ios-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Add iOS platform
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package simulator app
        run: |
          cd build/ios/Build/Products/Debug-iphonesimulator
          /usr/bin/zip -r "$GITHUB_WORKSPACE/RABI3-iOS-Simulator-App.zip" App.app

      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: RABI3-iOS-Simulator-App
          path: RABI3-iOS-Simulator-App.zip
          if-no-files-found: error
          retention-days: 14
